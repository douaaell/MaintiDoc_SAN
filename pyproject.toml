[project]
name = "maintidoc-san"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.17.1",
    "llama-index-core>=0.14.26",
    "llama-index-embeddings-huggingface>=0.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
